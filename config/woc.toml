# Crash Bandicoot: The Wrath of Cortex, USA v1.01 (SLUS-20238): the recompiler's settings for its executable.

[executable]
name = "SLUS_202.38"
sha1 = "016d5abca37996346582fffdc07970c89bb4514a"

[functions]
# Function starts the analysis can't find (reached only through computed addresses)
extra = []
# Addresses that look like starts but aren't
not = []

[overrides]
# address = "host function": replaced by the runtime or by src/
# MenuItem: notes where each menu line is drawn (src/menus.cpp), then draws it as before
"0x1e5478" = "WocMenuItem"
# UpdateCutMovie and UpdateGameCut: the cutscenes skipped by holding any button (src/skip.cpp)
"0x254bd8" = "WocUpdateCutMovie"
"0x255680" = "WocUpdateGameCut"
# DefaultGame: the language and the volumes chosen on the Mac (src/options.cpp)
"0x1eed18" = "WocDefaultGame"
# The sound effects' frame, called every frame of every loop: the loading screen's faster end, the PC menus' language changes
# and the save screen opened (src/options.cpp)
"0x248750" = "WocFrame"
# UpdateSaveSlots: the save file's read without the memory card's minimum wait (src/saving.cpp)
"0x253880" = "WocUpdateSaveSlots"
